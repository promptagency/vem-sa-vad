# Typecheck and build every pull request (Dependabot's included) and every
# push to main. There is no test runner (see CLAUDE.md), so this is the
# automatic check; anything touching transcription still needs a browser test.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
