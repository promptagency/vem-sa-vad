# Dependabot: weekly update PRs for npm packages and the GitHub Actions used here.
# Every PR is reviewed and tested like any other change; nothing merges itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # The model runtime first (a package joins the first group it matches).
      # Transformers.js pins development builds of onnxruntime-web, which
      # package.json's `overrides` replaces with a stable release; Dependabot
      # doesn't touch overrides, so an upgrade here also means moving the
      # override by hand and re-testing GPU, CPU and speaker separation (CLAUDE.md).
      model-runtime:
        patterns:
          - "@huggingface/transformers"
          - "onnxruntime-*"
      app:
        dependency-type: production
        update-types: [minor, patch]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
