<!doctype html>
<!--
  Served by Cloudflare Pages for any path that isn't a file. Its presence also
  turns off Pages' SPA fallback, which answered every unknown path with the app
  — including /some/path/assets/*.js, so the app loaded its scripts as HTML and
  stayed blank. The app has no routes of its own, so send visitors to its start.
  (A meta refresh: the CSP allows no inline script. So it goes to "/" — the
  hosted site lives at the root — and can't carry a query string along.)
-->
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/" />
    <title>Vem sa vad?</title>
  </head>
  <!-- The app's colours (src/index.css): --color-bg and --color-brand-300. -->
  <body style="margin: 0; background: #1a1a1a; color: #e5e5e5; font: 16px/1.5 system-ui, sans-serif">
    <p style="padding: 2rem 1rem; text-align: center">
      Sidan finns inte. <a href="/" style="color: #e59a7e">Gå till Vem sa vad?</a><br />
      <span lang="en">This page doesn’t exist. <a href="/" style="color: #e59a7e">Go to Vem sa vad?</a></span>
    </p>
  </body>
</html>
