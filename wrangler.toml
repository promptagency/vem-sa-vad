# Cloudflare Pages configuration for the hosted site (vemsavad.promptagency.se).
# Build command `npm run build`, output `dist/`; `functions/` holds the podcast proxy.
# Local check of the hosted setup: `npm run build && npx wrangler pages dev dist`.
name = "vem-sa-vad"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-08"

# Per-visitor limit on /proxy.php, kept by the Worker in workers/limiter. Deploy
# that Worker first: Pages refuses to deploy while it doesn't exist.
[[services]]
binding = "LIMITER"
service = "vem-sa-vad-limiter"
